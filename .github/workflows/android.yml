name: APK Android

# Gera o APK do PN Studio a cada push na branch pablo (ou pelo botão "Run workflow")
# e publica em Releases com link direto para baixar no celular.
on:
  push:
    branches: [pablo]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: npm ci

      - name: Build do app React (modo local, sem servidor)
        run: npx vite build --mode app

      - name: Copiar o app para o projeto Android
        run: npx cap sync android

      - name: Compilar o APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/release/app-release.apk PN-Studio.apk

      - name: Guardar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: PN-Studio-apk
          path: PN-Studio.apk

      - name: Publicar em Releases (link direto para o celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: PN Studio — build ${{ github.run_number }}
          body: |
            APK do Primeiras Notícias Studio (tudo local no aparelho).
            Baixe o arquivo **PN-Studio.apk** abaixo no celular e instale.
            Commit: ${{ github.sha }}
          files: PN-Studio.apk
          make_latest: true
